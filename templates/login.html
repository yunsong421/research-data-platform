<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 数据管理平台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-box {
            width: 100%; max-width: 380px; margin: 20px; padding: 36px 32px;
            background: var(--bg-card); border: 1px solid var(--border);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
            backdrop-filter: blur(20px); position: relative; overflow: hidden;
        }
        .login-box::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent);
        }
        .login-head { text-align: center; margin-bottom: 26px; }
        .login-mark {
            width: 56px; height: 56px; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 14px; font-weight: 800; letter-spacing: 1px; color: #001018;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 0 24px var(--primary-glow);
        }
        .login-head h1 {
            font-size: 19px; font-weight: 700; letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-head p { font-size: 12px; color: var(--text-muted); margin-top: 6px; letter-spacing: 1px; }
        .login-msg {
            padding: 9px 12px; border-radius: var(--radius-sm); font-size: 13px;
            margin-bottom: 14px; border: 1px solid;
        }
        .login-msg.err { color: var(--danger); border-color: rgba(255,51,85,0.4); background: var(--danger-bg); }
        .login-msg.ok { color: var(--success); border-color: rgba(0,255,136,0.4); background: var(--success-bg); }
        .login-box .btn { width: 100%; justify-content: center; margin-top: 6px; }
        .login-foot { margin-top: 18px; text-align: center; font-size: 11px; color: var(--text-muted); }
    </style>
</head>
<body>
<form class="login-box" method="post">
    <div class="login-head">
        <div class="login-mark">DB</div>
        <h1>数据管理平台</h1>
        <p>DATA MANAGEMENT PLATFORM</p>
    </div>

    {% if error %}<div class="login-msg err">{{ error }}</div>{% endif %}
    {% if message %}<div class="login-msg ok">{{ message }}</div>{% endif %}

    <input type="hidden" name="next" value="{{ next }}">
    <div class="form-group">
        <label>用户名</label>
        <input class="form-control" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="form-group">
        <label>密码</label>
        <input class="form-control" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">登 录</button>
    <div class="login-foot">仅限授权人员访问</div>
</form>
</body>
</html>
