{% extends "base.html" %}
{% block title %}标签管理 - 数据管理平台{% endblock %}
{% block page_title %}标签管理{% endblock %}
{% block header_actions %}
<button class="btn btn-primary" onclick="showCreate()">+ 新建标签</button>
{% endblock %}
{% block content %}
<div class="card">
    <div class="card-header"><h3>所有标签</h3></div>
    <div class="card-body">
        <div id="tag-list" style="display:flex;flex-wrap:wrap;gap:12px"></div>
    </div>
</div>

<script>
var COLORS = ['#6366f1','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6','#f97316','#06b6d4','#84cc16','#a855f7','#e11d48'];

function loadTags() {
    fetch('/api/tags').then(function(r){return r.json()}).then(function(d){
        var list = document.getElementById('tag-list');
        if (!d.items.length) { list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">\uD83C\uDFF7\uFE0F</div><div class="empty-state-text">暂无标签，点击右上方创建</div></div>'; return; }
        list.innerHTML = d.items.map(function(t){
            return '<div class="card" style="width:200px;cursor:default">' +
                '<div class="card-body" style="padding:16px;text-align:center">' +
                '<div style="display:inline-block;width:40px;height:40px;border-radius:50%;background:'+t.color+';margin-bottom:8px"></div>' +
                '<div style="font-weight:600;font-size:15px;margin-bottom:4px">'+esc(t.name)+'</div>' +
                '<div class="text-muted text-sm">使用 '+t.item_count+' 次</div>' +
                '<div style="margin-top:10px;display:flex;gap:4px;justify-content:center">' +
                '<button class="btn btn-sm btn-outline" onclick="showEdit('+t.id+',\''+esc(t.name)+'\',\''+t.color+'\')">\u270F\uFE0F 编辑</button>' +
                '<button class="btn btn-sm btn-danger" onclick="del('+t.id+')">\uD83D\uDDD1\uFE0F 删除</button></div></div></div>';
        }).join('');
    });
}
loadTags();

function showCreate() {
    var h = '<form id="tf"><div class="form-group"><label>标签名称</label><input class="form-control" name="name" required></div>';
    h += '<div class="form-group"><label>颜色</label><div class="color-picker-grid" id="color-picker">';
    COLORS.forEach(function(c){
        h += '<div class="color-swatch" style="background:'+c+'" data-color="'+c+'" onclick="pickColor(this,\''+c+'\')"></div>';
    });
    h += '</div><input type="hidden" name="color" id="selected-color" value="'+COLORS[0]+'"></div>';
    h += '<div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">创建</button></div></form>';
    openModal('新建标签', h);
    document.querySelector('.color-swatch').classList.add('selected');
    document.getElementById('tf').addEventListener('submit', function(e){
        e.preventDefault();
        var data = {name: this.name.value, color: document.getElementById('selected-color').value};
        fetch('/api/tags', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).then(function(r){return r.json()}).then(function(d){
            if (d.item) { showToast('创建成功','success'); closeModal(); loadTags(); }
            else { showToast(d.error||'创建失败','error'); }
        });
    });
}

function showEdit(id, name, color) {
    var h = '<form id="tf"><div class="form-group"><label>标签名称</label><input class="form-control" name="name" value="'+esc(name)+'" required></div>';
    h += '<div class="form-group"><label>颜色</label><div class="color-picker-grid" id="color-picker">';
    COLORS.forEach(function(c){
        var sel = c === color ? 'selected' : '';
        h += '<div class="color-swatch '+sel+'" style="background:'+c+'" data-color="'+c+'" onclick="pickColor(this,\''+c+'\')"></div>';
    });
    h += '</div><input type="hidden" name="color" id="selected-color" value="'+color+'"></div>';
    h += '<div class="form-actions"><button type="button" class="btn btn-outline" onclick="closeModal()">取消</button><button type="submit" class="btn btn-primary">保存</button></div></form>';
    openModal('编辑标签', h);
    document.getElementById('tf').addEventListener('submit', function(e){
        e.preventDefault();
        var data = {name: this.name.value, color: document.getElementById('selected-color').value};
        fetch('/api/tags/'+id, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)}).then(function(r){return r.json()}).then(function(d){
            if (d.item) { showToast('保存成功','success'); closeModal(); loadTags(); }
            else { showToast(d.error||'保存失败','error'); }
        });
    });
}

function pickColor(el, color) {
    document.querySelectorAll('.color-swatch').forEach(function(s){s.classList.remove('selected')});
    el.classList.add('selected');
    document.getElementById('selected-color').value = color;
}

function del(id) {
    if (!confirm('确认删除此标签？（关联关系将一并删除）')) return;
    fetch('/api/tags/'+id, {method:'DELETE'}).then(function(r){return r.json()}).then(function(d){
        if (d.ok) { showToast('删除成功','success'); loadTags(); }
        else { showToast(d.error||'删除失败','error'); }
    });
}
</script>
{% endblock %}
