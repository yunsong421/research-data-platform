# /etc/nginx/sites-available/data-platform
#
# Enable with:
#   ln -s /etc/nginx/sites-available/data-platform /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTPS certificates: use certbot once DNS points here
#   certbot --nginx -d your-domain.com

server {
    listen 80;
    server_name your-domain.com;

    # allow large uploads (videos up to 50 MB plus multipart overhead)
    client_max_body_size 64M;

    # long timeouts: chart rendering and big file uploads are slow
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        expires 7d;
    }
}
